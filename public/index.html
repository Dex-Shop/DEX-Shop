<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEX SHOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3f0;
  --bg-alt:#ede9e5;
  --card:#a8a39c;
  --card-light:#c9c1ba;
  --glass:rgba(0,0,0,0.04);
  --glass-border:rgba(0,0,0,0.08);
  --text:#2a2622;
  --text-dim:#6b6560;
  --text-faint:#9d9892;
  --violet:#8b6cf2;
  --violet-glow:rgba(139,108,242,0.35);
  --emerald:#34d399;
  --gold:#fbbf3f;
  --danger:#f2696b;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Plus Jakarta Sans',sans-serif;
  min-height:100vh;
  padding-bottom:60px;
  -webkit-touch-callout:none;
  user-select:none;
  -webkit-user-select:none;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;}
img{max-width:100%;display:block;pointer-events:none;-webkit-user-drag:none;user-drag:none;}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;}

.topbar{
  position:sticky;top:0;z-index:40;
  background:rgba(245,243,240,0.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--glass-border);
}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1080px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-cube{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,var(--violet),var(--emerald));box-shadow:0 0 14px var(--violet-glow);flex-shrink:0;}
.brand-name{font-size:13px;letter-spacing:0.5px;font-weight:700;}
.brand-name span{color:var(--violet);}

.hero{padding:56px 0 30px;text-align:center;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10px;letter-spacing:2px;color:var(--emerald);
  background:rgba(52,211,153,0.09);border:1px solid rgba(52,211,153,0.25);
  padding:6px 12px;border-radius:100px;margin-bottom:20px;
}
.eyebrow::before{content:"";width:6px;height:6px;background:var(--emerald);border-radius:1px;}
.hero h1{
  font-family:'Press Start 2P',monospace;
  font-size:22px;line-height:1.7;
  color:var(--text);
  margin-bottom:16px;
}
.hero p{color:var(--text-dim);font-size:14.5px;max-width:460px;margin:0 auto;line-height:1.6;}

.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:44px 0 18px;flex-wrap:wrap;gap:10px;}
.section-head h2{font-size:16px;font-weight:800;}
.section-head .hint{font-size:12px;color:var(--text-faint);}

.featured-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:640px){.featured-grid{grid-template-columns:repeat(2,1fr);}}

.skin-card{
  background:var(--card);border:1px solid var(--card-light);
  border-radius:var(--radius);overflow:hidden;
  transition:.22s ease;cursor:pointer;position:relative;
}
.skin-card:hover{transform:translateY(-4px);border-color:var(--violet);box-shadow:0 14px 30px -12px var(--violet-glow);}
.skin-card .thumb-box{aspect-ratio:1/1;background:var(--bg-alt);position:relative;overflow:hidden;}
.skin-card .thumb-box canvas{width:100%;height:100%;display:block;}
.skin-card .badge-top{
  position:absolute;top:8px;left:8px;font-size:9px;letter-spacing:1px;
  background:rgba(251,191,63,0.15);border:1px solid rgba(251,191,63,0.4);
  color:var(--gold);padding:4px 8px;border-radius:6px;font-family:'JetBrains Mono',monospace;
}
.skin-card .meta{padding:11px 12px 13px;}
.skin-card .meta .name{font-size:12.5px;font-weight:700;margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.skin-card .meta .stats{display:flex;gap:10px;font-size:10.5px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}
.skin-card .meta .stats .heart{color:var(--danger);}

.pager-row{display:flex;justify-content:center;margin-top:22px;}
.btn-next{
  background:linear-gradient(90deg,var(--violet),#a688ff);
  color:#fff;font-weight:700;font-size:12.5px;
  padding:12px 26px;border-radius:11px;
  display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 10px 24px -10px var(--violet-glow);
  transition:.2s;
}
.btn-next:hover{transform:translateY(-2px);}
.btn-next:disabled{opacity:0.35;cursor:not-allowed;transform:none;}

.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.chip{
  font-size:12px;padding:8px 15px;border-radius:9px;
  background:var(--card);border:1px solid var(--card-light);color:var(--text-dim);
  transition:.18s;
}
.chip:hover{color:var(--text);}
.chip.active{background:var(--emerald);border-color:var(--emerald);color:#04231a;font-weight:700;}

.catalog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
@media(max-width:640px){.catalog-grid{grid-template-columns:repeat(2,1fr);}}
.empty-note{color:var(--text-faint);font-size:13px;text-align:center;padding:40px 0;}

.hotbar{display:flex;align-items:center;justify-content:center;gap:6px;margin:30px auto 6px;flex-wrap:wrap;}
.hotbar-arrow{
  width:34px;height:34px;border-radius:8px;
  background:var(--card);border:1px solid var(--card-light);
  display:flex;align-items:center;justify-content:center;color:var(--text-dim);
  transition:.18s;font-size:14px;
}
.hotbar-arrow:hover:not(:disabled){border-color:var(--violet);color:#fff;}
.hotbar-arrow:disabled{opacity:0.3;cursor:not-allowed;}
.hotbar-slot{
  width:34px;height:34px;border-radius:8px;
  background:var(--bg-alt);border:1px solid var(--card-light);
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);
  transition:.18s;
}
.hotbar-slot:hover{border-color:var(--emerald);color:var(--text);}
.hotbar-slot.active{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:700;
  box-shadow:0 0 0 3px rgba(139,108,242,0.22);}
.hotbar-caption{width:100%;text-align:center;font-size:10.5px;color:var(--text-faint);margin-top:4px;}

.overlay{
  position:fixed;inset:0;background:rgba(245,243,240,0.85);backdrop-filter:blur(6px);
  z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;
}
.modal{
  background:var(--bg-alt);border:1px solid var(--card-light);border-radius:18px;
  max-width:420px;width:100%;max-height:88vh;overflow-y:auto;position:relative;
}
.modal-close{
  position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;
  background:var(--card);border:1px solid var(--card-light);color:var(--text-dim);
  display:flex;align-items:center;justify-content:center;z-index:5;font-size:16px;
}
.modal .thumb-box{aspect-ratio:1/1;background:var(--bg);border-radius:18px 18px 0 0;overflow:hidden;}
.modal .thumb-box canvas{width:100%;height:100%;display:block;}
.modal-body{padding:20px;}
.modal-body .cat-tag{
  display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;
  color:var(--emerald);background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.3);
  padding:4px 10px;border-radius:6px;margin-bottom:12px;font-weight:600;
}
.modal-body h3{font-size:16px;font-weight:800;margin-bottom:10px;}
.modal-body .desc{font-size:13px;color:var(--text-dim);margin-bottom:14px;line-height:1.6;}
.modal-stats{display:flex;gap:16px;font-size:11.5px;margin-bottom:16px;font-family:'JetBrains Mono',monospace;}
.modal-stats span{padding:8px 12px;background:var(--card);border-radius:8px;color:var(--text);}
.modal-stats .heart{color:var(--danger);}
.modal-stats .fire{color:var(--gold);}

.btn-primary{
  width:100%;background:linear-gradient(90deg,var(--violet),#a688ff);color:#fff;
  font-weight:700;font-size:13.5px;padding:14px;border-radius:11px;
  box-shadow:0 10px 24px -10px var(--violet-glow);margin-bottom:10px;transition:.2s;
}
.btn-primary:hover{transform:translateY(-2px);}
.like-btn{
  width:100%;background:var(--card);border:1px solid var(--card-light);color:var(--text-dim);
  font-size:12.5px;padding:12px;border-radius:11px;transition:.2s;font-weight:600;
}
.like-btn:hover{color:var(--text);}
.like-btn.liked{background:var(--danger);border-color:var(--danger);color:#fff;}

.qris-box{padding:20px;}
.qris-img-wrap{
  width:100%;aspect-ratio:1/1;background:var(--card);border-radius:12px;
  display:flex;align-items:center;justify-content:center;margin:20px 0;
  overflow:hidden;
}
.qris-img-wrap img,.qris-img-wrap canvas{width:100%;height:100%;object-fit:contain;}
.qris-empty{color:var(--text-faint);font-size:13px;text-align:center;}
.skin-name{font-size:15px;font-weight:700;text-align:center;margin-bottom:20px;}
.qris-actions{display:flex;flex-direction:column;gap:10px;}
.btn-ghost{
  background:var(--card);border:1px solid var(--card-light);color:var(--text-dim);
  font-size:12.5px;padding:12px;border-radius:11px;transition:.2s;font-weight:600;
}
.btn-ghost:hover{color:var(--text);}

.contact-admin-btn{
  width:100%;background:linear-gradient(90deg,#25d366,#20ba58);color:#fff;
  font-weight:700;font-size:12.5px;padding:12px;border-radius:11px;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;margin-top:12px;
}
.contact-admin-btn:hover{transform:translateY(-2px);}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);
  background:var(--text);color:#fff;padding:14px 20px;border-radius:8px;
  font-size:13px;z-index:200;transition:.3s;opacity:0;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

@media(max-width:640px){
  .featured-grid,.catalog-grid{grid-template-columns:repeat(2,1fr);}
  .hero h1{font-size:16px;}
}

@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.spinner{animation:spin 1s linear infinite;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-cube"></div>
      <div class="brand-name">DEX <span>Shop</span></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow">✨ Selamat Datang</div>
    <h1>DEX Shop</h1>
    <p>Koleksi skin Minecraft custom terbaik buatan tangan. Gratis atau donasi sesuai keinginanmu!</p>
  </div>

  <div class="section-head">
    <h2>🔥 Skin Unggulan</h2>
    <span class="hint" id="featured-page-hint">Halaman 1 / 1</span>
  </div>
  <div class="featured-grid" id="featured-grid"></div>
  <div class="pager-row">
    <button class="btn-next" id="btn-next-page" onclick="nextFeaturedPage()">Halaman Berikutnya →</button>
  </div>

  <div style="margin-top:50px;">
    <div class="section-head">
      <h2>📚 Katalog Lengkap</h2>
      <span class="hint" id="catalog-count-hint">0 skin</span>
    </div>
    <div class="chip-row" id="chip-row"></div>
    <div class="catalog-grid" id="catalog-grid"></div>
    <div id="hotbar-wrap"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const LS_SKINS='DRAW_SKINS';
const LS_LIKES='DRAW_LIKES';
const LS_QRIS='DRAW_QRIS';
const LS_THANKS='DRAW_THANKS_MSG';
const FEATURED_PER_PAGE=6;
const CATALOG_PER_PAGE=9;
const ADMIN_WA='6285236894690';

document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if(e.key==='PrintScreen'||e.ctrlKey&&e.shiftKey&&e.key==='s'||e.ctrlKey&&e.key==='p') e.preventDefault();
});

function pixelThumb(name){
  const canvas=document.createElement('canvas');
  canvas.width=256;canvas.height=256;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#87ceeb';
  ctx.fillRect(0,0,256,256);
  const colors=['#ff6b6b','#4ecdc4','#ffe66d','#95e1d3','#c7ceea'];
  for(let i=0;i<64;i++){
    ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];
    ctx.fillRect(Math.random()*256,Math.random()*256,32,32);
  }
  ctx.fillStyle='#333';
  ctx.font='bold 20px Arial';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(name.substring(0,6),128,128);
  return canvas.toDataURL();
}

function seedData(){
  const names=[
    ['Skin Cosplay Naruto','Cowok'],['Skin Cosplay Frieren','Cewek'],
    ['Skin Warrior Emerald','Cowok'],['Skin Sakura Petal','Cewek'],
    ['Skin Couple Sunset','Couple'],['Skin Neon Samurai','Anime'],
    ['Skin Ghost Ranger','Game'],['Skin Ice Queen','Cewek'],['Skin Dragon Knight','Cowok']
  ];
  return names.map((n,i)=>({
    id:'seed'+i,name:n[0],category:n[1],
    desc:'Skin custom hasil gambar sendiri, cocok buat cosplay dan server survival.',
    thumb:pixelThumb(n[0]+i),file:null,
    featured:i<6,likes:4+i*3,sold:10+i*7,createdAt:Date.now()-i*100000
  }));
}

let skins=JSON.parse(localStorage.getItem(LS_SKINS)||'null')||seedData();
if(!localStorage.getItem(LS_SKINS))localStorage.setItem(LS_SKINS,JSON.stringify(skins));
let likedIds=new Set(JSON.parse(localStorage.getItem(LS_LIKES)||'[]'));
let qrisImg=localStorage.getItem(LS_QRIS)||'';
let thankYouMsg=localStorage.getItem(LS_THANKS)||'Makasih udah dukung, semoga suka skinnya!';

function persist(){localStorage.setItem(LS_SKINS,JSON.stringify(skins));}
function persistLikes(){localStorage.setItem(LS_LIKES,JSON.stringify([...likedIds]));}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

let featuredPage=0,activeCategory='Semua',catalogPage=0;

function renderFeatured(){
  const list=skins.filter(s=>s.featured);
  const totalPages=Math.max(1,Math.ceil(list.length/FEATURED_PER_PAGE));
  featuredPage=Math.min(featuredPage,totalPages-1);
  const slice=list.slice(featuredPage*FEATURED_PER_PAGE,featuredPage*FEATURED_PER_PAGE+FEATURED_PER_PAGE);
  const grid=document.getElementById('featured-grid');
  grid.innerHTML=slice.length?slice.map(cardHtml).join(''):'<div class="empty-note" style="grid-column:1/-1;">Belum ada skin unggulan.</div>';
  document.getElementById('featured-page-hint').textContent=`Halaman ${featuredPage+1} / ${totalPages}`;
  const btn=document.getElementById('btn-next-page');
  btn.disabled=totalPages<=1;
  btn.textContent=featuredPage+1>=totalPages?'↺ Halaman Pertama':'Halaman Berikutnya →';
}
function nextFeaturedPage(){
  const list=skins.filter(s=>s.featured);
  const totalPages=Math.max(1,Math.ceil(list.length/FEATURED_PER_PAGE));
  featuredPage=(featuredPage+1>=totalPages)?0:featuredPage+1;
  renderFeatured();
}

function cardHtml(s){
  return `<div class="skin-card" onclick="openDetail('${s.id}')">
    <div class="thumb-box">
      ${s.featured?'<div class="badge-top">TOP</div>':''}
      <canvas id="thumb-${s.id}"></canvas>
    </div>
    <div class="meta">
      <div class="name">${s.name}</div>
      <div class="stats"><span class="heart">♥ ${s.likes}</span><span>⇣ ${s.sold}</span></div>
    </div>
  </div>`;
}

function renderCanvasThumb(s){
  const cnv=document.getElementById('thumb-'+s.id);
  if(!cnv)return;
  const ctx=cnv.getContext('2d');
  cnv.width=256;cnv.height=256;
  ctx.fillStyle='#e8e0d5';
  ctx.fillRect(0,0,256,256);
  const img=new Image();
  img.src=s.thumb;
  img.onload=()=>{ctx.drawImage(img,0,0,256,256);};
}

function categories(){return['Semua',...new Set(skins.map(s=>s.category))];}

function renderChips(){
  document.getElementById('chip-row').innerHTML=categories().map(c=>
    `<button class="chip ${c===activeCategory?'active':''}" onclick="setCategory('${c}')">${c}</button>`
  ).join('');
}
function setCategory(c){activeCategory=c;catalogPage=0;renderChips();renderCatalog();}

function filteredCatalog(){
  return activeCategory==='Semua'?skins.slice():skins.filter(s=>s.category===activeCategory);
}

function renderCatalog(){
  const list=filteredCatalog();
  const totalPages=Math.max(1,Math.ceil(list.length/CATALOG_PER_PAGE));
  catalogPage=Math.min(catalogPage,totalPages-1);
  const slice=list.slice(catalogPage*CATALOG_PER_PAGE,catalogPage*CATALOG_PER_PAGE+CATALOG_PER_PAGE);
  document.getElementById('catalog-grid').innerHTML=slice.length?slice.map(cardHtml).join(''):'<div class="empty-note" style="grid-column:1/-1;">Belum ada skin di kategori ini.</div>';
  slice.forEach(s=>setTimeout(()=>renderCanvasThumb(s),50));
  document.getElementById('catalog-count-hint').textContent=`${list.length} skin`;
  renderHotbar(totalPages);
}

function renderHotbar(totalPages){
  let slots='';
  for(let i=0;i<totalPages;i++){
    slots+=`<button class="hotbar-slot ${i===catalogPage?'active':''}" onclick="goCatalogPage(${i})">${i+1}</button>`;
  }
  document.getElementById('hotbar-wrap').innerHTML=`
    <div class="hotbar">
      <button class="hotbar-arrow" ${catalogPage<=0?'disabled':''} onclick="goCatalogPage(${catalogPage-1})">‹</button>
      ${slots}
      <button class="hotbar-arrow" ${catalogPage>=totalPages-1?'disabled':''} onclick="goCatalogPage(${catalogPage+1})">›</button>
      <div class="hotbar-caption">9 slot per halaman, kayak hotbar Minecraft</div>
    </div>`;
}
function goCatalogPage(p){
  const totalPages=Math.max(1,Math.ceil(filteredCatalog().length/CATALOG_PER_PAGE));
  if(p<0||p>=totalPages)return;
  catalogPage=p;renderCatalog();
}

function openDetail(id){
  const s=skins.find(x=>x.id===id);if(!s)return;
  const liked=likedIds.has(id);
  const overlay=document.createElement('div');
  overlay.className='overlay';overlay.id='detail-overlay';
  overlay.onclick=(e)=>{if(e.target===overlay)closeOverlay('detail-overlay');};
  overlay.innerHTML=`
    <div class="modal">
      <button class="modal-close" onclick="closeOverlay('detail-overlay')">✕</button>
      <div class="thumb-box"><canvas id="detail-thumb"></canvas></div>
      <div class="modal-body">
        <div class="cat-tag">${s.category}</div>
        <h3>${s.name}</h3>
        <div class="desc">${s.desc||'Belum ada deskripsi.'}</div>
        <div class="modal-stats">
          <span class="heart">♥ ${s.likes} suka</span>
          <span class="fire">⇣ ${s.sold} download</span>
        </div>
        <button class="btn-primary" onclick="closeOverlay('detail-overlay');openPayment('${s.id}')">Ambil Skin Ini</button>
        <button class="like-btn ${liked?'liked':''}" id="like-btn" onclick="toggleLike('${s.id}')">${liked?'♥ Sudah disuka':'♡ Suka skin ini'}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const cnv=document.getElementById('detail-thumb');
  const ctx=cnv.getContext('2d');
  cnv.width=400;cnv.height=400;
  const img=new Image();
  img.src=s.thumb;
  img.onload=()=>{ctx.drawImage(img,0,0,400,400);};
}
function toggleLike(id){
  const s=skins.find(x=>x.id===id);if(!s)return;
  if(likedIds.has(id)){likedIds.delete(id);s.likes=Math.max(0,s.likes-1);}
  else{likedIds.add(id);s.likes++;}
  persist();persistLikes();
  const btn=document.getElementById('like-btn');
  const liked=likedIds.has(id);
  btn.className='like-btn '+(liked?'liked':'');
  btn.textContent=liked?'♥ Sudah disuka':'♡ Suka skin ini';
  renderFeatured();renderCatalog();
}
function closeOverlay(id){const el=document.getElementById(id);if(el)el.remove();}

function openPayment(id){
  const s=skins.find(x=>x.id===id);if(!s)return;
  const overlay=document.createElement('div');
  overlay.className='overlay';overlay.id='pay-overlay';
  overlay.onclick=(e)=>{if(e.target===overlay)closeOverlay('pay-overlay');};
  overlay.innerHTML=`
    <div class="modal">
      <button class="modal-close" onclick="closeOverlay('pay-overlay')">✕</button>
      <div class="qris-box">
        <div class="eyebrow">PEMBAYARAN : QRIS</div>
        <div style="text-align:center;margin-bottom:12px;">
          <h3 style="color:var(--text);margin-bottom:6px;">${s.name}</h3>
          <div style="font-size:12px;color:var(--text-faint);">Terjual: ${s.sold}</div>
        </div>
        <div class="qris-img-wrap">
          <img src="/api/images/qris" alt="QRIS" style="max-width:100%;max-height:100%;">
        </div>
        <div style="background:var(--card);padding:12px;border-radius:8px;margin-bottom:14px;font-size:12px;color:var(--text-faint);text-align:center;">
          Scan QRIS untuk pembayaran | Dana • GoPay • Bank Transfer
        </div>
        <div class="qris-actions">
          <button class="btn-primary" onclick="contactAdminVerify('${s.id}','${s.name}')">
            📞 Verifikasi via WhatsApp
          </button>
          <button class="btn-ghost" onclick="finishDownload('${s.id}')">Lewati &amp; Download Gratis</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function contactAdminVerify(id,name){
  const s=skins.find(x=>x.id===id);if(!s)return;
  const message=`Halo Admin DEX Shop!\n\nAku mau verifikasi pembayaran untuk skin:\n*Nama Skin:* ${name}\n\nBerikut aku lampirkan bukti QRIS transfer-nya ya. Ditunggu file downloadnya!`;
  const waLink=`https://api.whatsapp.com/send?phone=${ADMIN_WA}&text=${encodeURIComponent(message)}`;
  fetch('/api/orders/verify',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({orderId:'ord_'+Date.now(),skinName:name,amount:0})
  }).then(r=>r.json()).catch(e=>console.error(e));
  window.open(waLink,'_blank');
  showToast('Silakan lampirkan bukti QRIS di WhatsApp!');
  closeOverlay('pay-overlay');
  s.sold++;
  persist();
  renderFeatured();
  renderCatalog();
}

function finishDownload(id){
  const s=skins.find(x=>x.id===id);if(!s)return;
  s.sold++;persist();
  closeOverlay('pay-overlay');
  showToast('Download dimulai! Terima kasih! 🎉');
  renderFeatured();renderCatalog();
}

renderChips();renderFeatured();renderCatalog();
</script>
</body>
</html>
